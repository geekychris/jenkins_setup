version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"  # Web UI
      - "50000:50000"  # Agent connections
    volumes:
      - jenkins_home:/var/jenkins_home  # Persist Jenkins data
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker via socket
      - ./jenkins-init-scripts:/usr/share/jenkins/ref/init.groovy.d/  # Initialization scripts
    environment:
      - JENKINS_OPTS="--prefix=/jenkins"  # Optional: configure a context path
      - TZ=America/Los_Angeles  # Set timezone, adjust as needed
      - JENKINS_JAVA_OPTS="-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
    networks:
      - jenkins-network

networks:
  jenkins-network:
    driver: bridge

volumes:
  jenkins_home:
    driver: local

